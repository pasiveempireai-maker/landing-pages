  <title>קבלו מיליארד טוקנים בחינם — קוד YZ9E7C</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #11282c;
      --surface: #f8fcfb;
      --ink: #102023;
      --hero-ink: #f7fbfa;
      --muted: #bed0cd;
      --line: rgba(255, 255, 255, .18);
      --accent: #eb4b40;
      --accent-hover: #c43730;
      --success: #9fe4cf;
      --shadow: 0 28px 80px rgba(4, 18, 20, .3);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1d20;
        --surface: #f8fcfb;
        --ink: #102023;
        --hero-ink: #f7fbfa;
        --muted: #c1d3d0;
        --line: rgba(255, 255, 255, .2);
        --accent: #ff6258;
        --accent-hover: #dd463d;
        --success: #a8ead7;
        --shadow: 0 28px 80px rgba(0, 0, 0, .42);
      }
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-width: 0;
      background: var(--bg);
      color: var(--hero-ink);
      font-family: "Manrope", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .page {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      align-items: center;
    }
    .page::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(90deg, rgba(6, 23, 26, .98) 0%, rgba(6, 23, 26, .92) 43%, rgba(6, 23, 26, .42) 72%, rgba(6, 23, 26, .2) 100%);
      pointer-events: none;
    }
    .backdrop {
      position: absolute;
      z-index: -2;
      inset: 0 0 0 42%;
      width: 58%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: .92;
    }
    .wrap {
      width: min(1100px, calc(100% - 40px));
      margin-inline: auto;
      padding: 72px 0;
    }
    .content { max-width: 660px; }
    .offer-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 24px;
      color: #ffaaa4;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .offer-line::before {
      content: "";
      width: 28px;
      height: 2px;
      background: var(--accent);
    }
    h1 {
      max-width: 650px;
      margin: 0;
      font-size: clamp(48px, 7.2vw, 86px);
      line-height: .98;
      letter-spacing: -.055em;
      font-weight: 800;
    }
    .free { color: #ff746b; }
    .intro {
      max-width: 570px;
      margin: 26px 0 32px;
      color: var(--muted);
      font-size: clamp(18px, 2vw, 22px);
      line-height: 1.55;
    }
    .code-panel {
      display: flex;
      align-items: center;
      gap: 14px;
      width: min(100%, 540px);
      padding: 11px 11px 11px 22px;
      background: var(--surface);
      color: var(--ink);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    .code {
      flex: 1;
      min-width: 0;
      font-family: "DM Mono", monospace;
      font-size: clamp(27px, 5vw, 39px);
      font-weight: 500;
      letter-spacing: .15em;
      white-space: nowrap;
    }
    .copy-button {
      min-height: 56px;
      padding: 0 24px;
      border: 0;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      transition: background .18s ease, transform .18s ease;
    }
    .copy-button:hover { background: var(--accent-hover); }
    .copy-button:active { transform: translateY(1px); }
    .copy-button:focus-visible { outline: 3px solid #72d9df; outline-offset: 4px; }
    .status {
      min-height: 24px;
      margin-top: 13px;
      color: var(--success);
      font-size: 14px;
      font-weight: 700;
    }
    .steps {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 26px;
      margin: 22px 0 0;
      padding: 22px 0 0;
      border-top: 1px solid var(--line);
      list-style: none;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }
    .steps li { display: flex; align-items: center; gap: 9px; }
    .step-number {
      display: inline-grid;
      place-items: center;
      width: 25px;
      height: 25px;
      border: 1px solid rgba(255, 255, 255, .34);
      border-radius: 50%;
      color: var(--hero-ink);
      font-family: "DM Mono", monospace;
      font-size: 12px;
    }
    .fine-print {
      max-width: 540px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    @media (max-width: 720px) {
      .page { align-items: end; }
      .page::after { background: linear-gradient(0deg, rgba(6, 23, 26, .99) 0%, rgba(6, 23, 26, .92) 59%, rgba(6, 23, 26, .32) 100%); }
      .backdrop { inset: 0; width: 100%; height: 100%; opacity: .62; object-position: 67% center; }
      .wrap { width: min(100% - 28px, 1100px); padding: 180px 0 34px; }
      .offer-line { margin-bottom: 18px; }
      h1 { font-size: clamp(45px, 14.4vw, 64px); }
      .intro { margin: 20px 0 26px; font-size: 17px; }
      .code-panel { gap: 8px; padding: 8px 8px 8px 14px; border-radius: 11px; }
      .code { font-size: clamp(23px, 8vw, 33px); letter-spacing: .09em; }
